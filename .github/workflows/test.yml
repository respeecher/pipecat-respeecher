name: Test

on:
  push:
    branches:
      - main
    paths:
      - src/**
      - tests/**
      - pyproject.toml
      - .github/workflows/test.yml
  pull_request:
    paths:
      - src/**
      - tests/**
      - pyproject.toml
      - .github/workflows/test.yml
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
        pipecat-ai: ${{ github.event_name == 'schedule' && fromJSON('[""]') || fromJSON('["==1.1.0", "==1.7.0", "==1.8.0", ""]') }}
    name: py${{ matrix.python-version }} pipecat-ai${{ matrix.pipecat-ai || ' latest' }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - run: uv venv

      - run: uv pip install "pipecat-ai${{ matrix.pipecat-ai }}" . pytest pytest-asyncio

      - run: .venv/bin/python -m pytest
